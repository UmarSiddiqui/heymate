# Builds HeyMate on every push to main that touches the app, and publishes it
# as a GitHub Release with a downloadable HeyMate.dmg and grouped release notes.
#
# Builds are signed with a self-signed certificate held in repo secrets
# (HEYMATE_SIGNING_P12_BASE64 / HEYMATE_SIGNING_P12_PASSWORD). It is not an
# Apple Developer ID, so users still open the first launch with
# Control-click → Open, but every release carries the same designated
# requirement and macOS keeps the user's permission grants across updates.
# See .github/scripts/import-signing-identity.sh.
#
# Version: MARKETING_VERSION from the Xcode project + the workflow run number,
# e.g. 1.0.7 → tag v1.0.7. Run it by hand from the Actions tab with
# "Run workflow" to rebuild without a code change.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "heymate/**"
      - ".github/workflows/release.yml"
      - ".github/scripts/**"
      - "!heymate/worker/**"
      - "!heymate/design/**"
      - "!**/*.md"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pi-runtime:
    name: Prepare Pi harness (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    steps:
      - name: Check out HeyMate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned harness Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
      - name: Prepare locked custom harness
        run: |
          python3 heymate/scripts/pi-runtime-tests.py
          python3 heymate/scripts/pi-runtime-build.py --out "$RUNNER_TEMP/MateAgent"
          python3 heymate/scripts/pi-runtime-stage.py --source "$RUNNER_TEMP/MateAgent" --destination "$RUNNER_TEMP/verify/MateAgent" --verify-only
          (cd heymate/agent-runtime && npm ci --ignore-scripts --no-audit --no-fund && npm test)
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/pi-${{ matrix.arch }}.tar.gz" MateAgent
      - name: Keep runtime payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pi-runtime-${{ matrix.arch }}
          path: ${{ runner.temp }}/pi-${{ matrix.arch }}.tar.gz
          retention-days: 2
          if-no-files-found: error

  release:
    needs: pi-runtime
    runs-on: macos-26
    timeout-minutes: 60
    # Every merge to main reaches users through in-app updates, so a person
    # approves each release before it can use the signing secrets. The
    # environment only accepts runs from main.
    environment: release
    env:
      PROJECT: heymate/HeyMate.xcodeproj
      SCHEME: HeyMate
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      APP_NAME: HeyMate
      # Public ingestion token. Runtime consent remains off by default.
      POSTHOG_API_KEY: ${{ vars.POSTHOG_API_KEY }}
      POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
      # In-app updates (Sparkle). The feed is the appcast.xml attached to the
      # latest GitHub Release; the public key is not secret. The matching
      # private key lives in the SPARKLE_PRIVATE_KEY repo secret.
      SPARKLE_FEED_URL: https://github.com/UmarSiddiqui/heymate/releases/latest/download/appcast.xml
      SPARKLE_PUBLIC_ED_KEY: Ei6V7FaIyqPSDeHkBYubrNFdTaLQWBHKiPizFIWvUmI=
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 installation found on this runner." && exit 1
          fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Work out the version
        id: version
        run: |
          MARKETING=$(sed -n 's/.*MARKETING_VERSION = \([0-9.]*\);/\1/p' "$PROJECT/project.pbxproj" | head -1)
          BUILD="${{ github.run_number }}"
          VERSION="${MARKETING}.${BUILD}"
          PREVIOUS_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          echo "marketing=$MARKETING" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
          echo "Building HeyMate $VERSION (previous release: ${PREVIOUS_TAG:-none})"

      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DERIVED_DATA }}/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('heymate/HeyMate.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Download prepared Pi harnesses
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pi-runtime-*
          path: ${{ runner.temp }}/pi-artifacts
          merge-multiple: true
      - name: Assemble universal Pi resources
        run: |
          mkdir -p "$RUNNER_TEMP/pi-universal"
          for ARCH in arm64 x86_64; do
            mkdir -p "$RUNNER_TEMP/pi-unpack-$ARCH"
            tar -xzf "$RUNNER_TEMP/pi-artifacts/pi-$ARCH.tar.gz" -C "$RUNNER_TEMP/pi-unpack-$ARCH"
            mv "$RUNNER_TEMP/pi-unpack-$ARCH/MateAgent" "$RUNNER_TEMP/pi-universal/$ARCH"
          done
          python3 -c 'import json,os,pathlib; r=pathlib.Path(os.environ["RUNNER_TEMP"])/"pi-universal"; m=json.loads((r/"arm64/manifest.json").read_text()); (r/"manifest.json").write_text(json.dumps({"schema":1,"engine":"heymate-pi","sourceCommit":m["sourceCommit"],"payloads":{"arm64":"arm64","x86_64":"x86_64"}}))'
          python3 heymate/scripts/pi-runtime-stage.py --source "$RUNNER_TEMP/pi-universal" --destination "$RUNNER_TEMP/verify/MateAgent" --verify-only
          echo "HEYMATE_PI_RUNTIME=$RUNNER_TEMP/pi-universal" >> "$GITHUB_ENV"

      - name: Import the signing identity
        id: signing
        env:
          HEYMATE_SIGNING_P12_BASE64: ${{ secrets.HEYMATE_SIGNING_P12_BASE64 }}
          HEYMATE_SIGNING_P12_PASSWORD: ${{ secrets.HEYMATE_SIGNING_P12_PASSWORD }}
        run: |
          IDENTITY=$(.github/scripts/import-signing-identity.sh "$RUNNER_TEMP/heymate-signing.keychain-db")
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"

      - name: Build (universal, self-signed)
        # Xcode now defaults ENABLE_CODE_COVERAGE to YES, and Swift packages
        # only pick up the override from the command line. Instrumented
        # binaries write an LLVM profile error to every agent runner log.
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_CODE_COVERAGE=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="${{ steps.signing.outputs.identity }}" \
            DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            POSTHOG_API_KEY="$POSTHOG_API_KEY" \
            POSTHOG_HOST="$POSTHOG_HOST" \
            SPARKLE_FEED_URL="$SPARKLE_FEED_URL" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            build > build.log 2>&1 || {
              grep -E "error:" build.log | head -50
              tail -60 build.log
              exit 1
            }
          grep -E "\*\* BUILD" build.log

      - name: Verify the app, Pi harness and embedded agent runner
        run: |
          APP="$DERIVED_DATA/Build/Products/Release/$APP_NAME.app"
          test -d "$APP"
          source heymate/script/code_signature_checks.sh
          heymate_verify_embedded_agent_runner "$APP" release
          python3 heymate/scripts/pi-runtime-stage.py --source "$APP/Contents/Resources/MateAgent" --destination "$RUNNER_TEMP/verify/MateAgent" --verify-only
          # Startup/protocol smoke uses the signed bundled Node, no provider/model calls.
          python3 heymate/scripts/pi-runtime-smoke.py --root "$APP/Contents/Resources/MateAgent/$(uname -m)"
          # Verify the seal after everything above has run the bundled code.
          codesign --verify --deep --strict --verbose=2 "$APP"
          # Permissions survive updates only while this requirement stays put.
          codesign -dr - "$APP" 2>&1 | grep -q 'certificate root = H"a5bc67c8702a1027e762f26cf4f3400686fe7d5e"' \
            || { echo "::error::HeyMate is not signed with the HeyMate Open Source Signing certificate"; codesign -dr - "$APP"; exit 1; }
          # Coverage-instrumented code would print an LLVM profile error into
          # every agent runner log, so empty logs would never be cleaned up.
          for BINARY in "$APP/Contents/MacOS/$APP_NAME" "$APP/Contents/Helpers/HeyMateAgentRunner"; do
            if otool -l "$BINARY" | grep -q __llvm_prf; then
              echo "::error::$BINARY was built with code coverage instrumentation"; exit 1
            fi
          done
          lipo -archs "$APP/Contents/MacOS/$APP_NAME"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Contents/Info.plist"

      - name: Lock away the signing keychain
        # Signing is done. Delete the keychain before later DMG packaging
        # tools run, so those tools cannot use it.
        run: security delete-keychain "$RUNNER_TEMP/heymate-signing.keychain-db" 2>/dev/null || true

      - name: Package HeyMate.dmg
        run: |
          APP="$DERIVED_DATA/Build/Products/Release/$APP_NAME.app"
          mkdir -p dist
          brew install create-dmg >/dev/null 2>&1 || true
          if command -v create-dmg >/dev/null && create-dmg \
              --volname "$APP_NAME" \
              --window-pos 200 120 \
              --window-size 660 400 \
              --icon-size 100 \
              --icon "$APP_NAME.app" 160 195 \
              --app-drop-link 500 195 \
              --background heymate/dmg-background.png \
              --no-internet-enable \
              "dist/$APP_NAME.dmg" "$APP"; then
            echo "Styled DMG created."
          else
            echo "create-dmg unavailable or failed; building a plain DMG."
            rm -f "dist/$APP_NAME.dmg"
            STAGE=$(mktemp -d)
            cp -R "$APP" "$STAGE/"
            ln -s /Applications "$STAGE/Applications"
            hdiutil create -volname "$APP_NAME" -srcfolder "$STAGE" -ov -format UDZO "dist/$APP_NAME.dmg"
          fi
          hdiutil verify "dist/$APP_NAME.dmg"
          # Check the app people actually download, not just the build output.
          MOUNT=$(mktemp -d)
          hdiutil attach "dist/$APP_NAME.dmg" -readonly -nobrowse -mountpoint "$MOUNT" >/dev/null
          codesign --verify --deep --strict --verbose=2 "$MOUNT/$APP_NAME.app" \
            || { hdiutil detach "$MOUNT" >/dev/null; echo "::error::The app inside $APP_NAME.dmg fails its code signature check"; exit 1; }
          hdiutil detach "$MOUNT" >/dev/null
          (cd dist && shasum -a 256 "$APP_NAME.dmg" > "$APP_NAME.dmg.sha256")
          ls -la dist

      - name: Sign the update and write appcast.xml
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY secret is not set; installed apps could not verify this update." && exit 1
          fi
          SIGN_UPDATE=$(find "$DERIVED_DATA/SourcePackages/artifacts" -path '*Sparkle/bin/sign_update' -not -path '*old_dsa*' | head -1)
          test -x "$SIGN_UPDATE"
          # Prints: sparkle:edSignature="..." length="..."
          SIGNATURE=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - "dist/$APP_NAME.dmg")
          echo "$SIGNATURE" | grep -q 'sparkle:edSignature=' || { echo "::error::sign_update produced no signature"; exit 1; }
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build }}"
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/$APP_NAME.dmg"
          cat > dist/appcast.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <rss xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" version="2.0">
            <channel>
              <title>HeyMate</title>
              <link>https://getheymate.vercel.app</link>
              <language>en</language>
              <item>
                <title>HeyMate $VERSION</title>
                <pubDate>$(date -u '+%a, %d %b %Y %H:%M:%S +0000')</pubDate>
                <sparkle:version>$BUILD</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.2</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.tag }}</sparkle:releaseNotesLink>
                <enclosure url="$DMG_URL" type="application/x-apple-diskimage" $SIGNATURE />
              </item>
            </channel>
          </rss>
          EOF
          cat dist/appcast.xml
          xmllint --noout dist/appcast.xml

      - name: Write release notes
        run: |
          .github/scripts/release-notes.sh \
            "${{ steps.version.outputs.version }}" \
            "${{ steps.version.outputs.previous_tag }}" > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "dist/$APP_NAME.dmg" \
            "dist/$APP_NAME.dmg.sha256" \
            dist/appcast.xml \
            --target "$GITHUB_SHA" \
            --title "HeyMate ${{ steps.version.outputs.version }}" \
            --notes-file notes.md \
            --latest

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/heymate-signing.keychain-db" 2>/dev/null || true

      - name: Keep the build log on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
