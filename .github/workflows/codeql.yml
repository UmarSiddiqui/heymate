name: CodeQL analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 17 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            runner: ubuntu-latest
            build_mode: none
          - language: javascript-typescript
            runner: ubuntu-latest
            build_mode: none
          - language: python
            runner: ubuntu-latest
            build_mode: none
          - language: swift
            runner: macos-26
            build_mode: manual
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the newest Xcode 26
        if: matrix.language == 'swift'
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then
            echo "::error::No Xcode 26 installation found on this runner."
            exit 1
          fi
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          queries: security-extended

      # The default -target autobuild misses PostHog's CrashReporter module.
      - name: Build HeyMate and its tests for extraction
        if: matrix.language == 'swift'
        run: |
          xcodebuild \
            -project heymate/HeyMate.xcodeproj \
            -scheme HeyMate \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/CodeQLDerivedData" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILATION_CACHE_ENABLE_CACHING=NO \
            SWIFT_ENABLE_COMPILE_CACHE=NO \
            SWIFT_USE_INTEGRATED_DRIVER=NO \
            build-for-testing

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:${{ matrix.language }}
