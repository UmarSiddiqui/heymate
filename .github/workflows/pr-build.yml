name: Public DMG startup QA

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published HeyMate release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  public-dmg-startup:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, xcode-27]
    timeout-minutes: 9
    steps:
      - name: Install, launch and relaunch published HeyMate
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/HeyMate.dmg"
          mount="$RUNNER_TEMP/heymate-dmg"
          app=/Applications/HeyMate.app
          executable="$app/Contents/MacOS/HeyMate"
          sw_vers
          launchctl print "gui/$(id -u)" >/dev/null
          test ! -e "$app"

          [[ "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]
          base="https://github.com/UmarSiddiqui/heymate/releases/download/$RELEASE_TAG"
          curl --fail --location --retry 2 --silent --show-error --max-time 240 "$base/HeyMate.dmg" -o "$dmg"
          curl --fail --location --retry 2 --silent --show-error "$base/HeyMate.dmg.sha256" -o "$dmg.sha256"
          expected="$(awk 'NR==1 {print $1}' "$dmg.sha256")"
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(shasum -a 256 "$dmg" | awk '{print $1}')" == "$expected" ]]
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");HeyMate release QA;" "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          mkdir "$mount"
          hdiutil attach -readonly -nobrowse -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          sudo ditto "$mount/HeyMate.app" "$app"
          sudo xattr -w com.apple.quarantine "$(xattr -p com.apple.quarantine "$dmg")" "$app"
          /usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "${RELEASE_TAG#v}"
          xcrun stapler validate "$app"
          codesign --verify --deep --strict "$app"
          syspolicy_check distribution "$app"
          spctl --assess --type execute --verbose=2 "$app"
          hdiutil detach "$mount"
          trap - EXIT

          launch_and_check() {
            local label="$1" pid
            "$executable" > "$RUNNER_TEMP/heymate-process.log" 2>&1 &
            pid=$!
            for attempt in {1..6}; do
              sleep 5
              if ! kill -0 "$pid" 2>/dev/null; then
                wait "$pid" || echo "$label exit status: $?"
                tail -50 "$RUNNER_TEMP/heymate-process.log"
                return 1
              fi
            done
            echo "$label: PID $pid stayed alive for 30 seconds."
            kill -TERM "$pid"
            wait "$pid" || true
          }

          launch_and_check 'First process launch'
          launch_and_check 'Second process launch'
      - name: Inspect process exit and crash evidence
        if: always()
        shell: bash
        run: |
          reports="$HOME/Library/Logs/DiagnosticReports"
          if [ -d "$reports" ]; then
            while IFS= read -r report; do
              echo "${report##*/}"
              head -70 "$report"
            done < <(find "$reports" -maxdepth 2 -type f \( -name 'HeyMate-*.ips' -o -name 'HeyMate-*.crash' \) -print)
          fi
          /usr/bin/log show --last 5m --style compact --predicate '(process == "ReportCrash" OR process == "runningboardd" OR process == "launchservicesd") AND (eventMessage CONTAINS[c] "com.heymate.app" OR eventMessage CONTAINS[c] "HeyMate.app") AND (eventMessage CONTAINS[c] "termination reported" OR eventMessage CONTAINS[c] "crash" OR eventMessage CONTAINS[c] "launch failed")' | tail -30
